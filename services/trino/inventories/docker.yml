all:
  hosts:
    trino:
      ansible_host: localhost
      ansible_port: 2222
      ansible_user: ansible
      ansible_ssh_private_key_file: ./ansible_key
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
      # keep the heap small enough for Docker Desktop's default VM
      trino_jvm_heap: 2G
