# Local HA testing inventory (uses Patroni raft DCS — no DynamoDB required)
all:
  hosts:
    pg-node-1:
      ansible_host: localhost
      ansible_port: 2222
      ansible_user: ansible
      ansible_ssh_private_key_file: ansible_key
      patroni_node_name: pg-node-1
      patroni_connect_address: 172.20.0.10
      patroni_partner_addrs:
        - 172.20.0.11
    pg-node-2:
      ansible_host: localhost
      ansible_port: 2223
      ansible_user: ansible
      ansible_ssh_private_key_file: ansible_key
      patroni_node_name: pg-node-2
      patroni_connect_address: 172.20.0.11
      patroni_partner_addrs:
        - 172.20.0.10
  vars:
    patroni_scope: pg-cluster
    patroni_use_raft: true
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
